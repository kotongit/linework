name: Windows

on:
  push:
    branches: [main]
    paths: ["windows/**", "shared/**", ".github/workflows/windows.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Core tests
        run: dotnet test windows/Linework.Core.Tests --logger "console;verbosity=minimal"
      - name: Harness
        shell: pwsh
        run: |
          dotnet build windows/Linework.App -c Debug -v quiet
          $env:LINEWORK_LIBRARY = Join-Path $env:RUNNER_TEMP "harness-library"
          $env:LINEWORK_SHOTS = Join-Path $env:RUNNER_TEMP "shots"
          $app = Get-ChildItem windows/Linework.App/bin/Debug -Recurse -Filter Linework.exe | Select-Object -First 1
          $p = Start-Process $app.FullName -ArgumentList "--harness" -PassThru -Wait -RedirectStandardOutput harness.log
          Get-Content harness.log
          if ($p.ExitCode -ne 0 -or (Select-String -Path harness.log -Pattern "^FAIL" -Quiet)) { throw "Harness failed" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn
      - name: Publish
        run: dotnet publish windows/Linework.App -c Release -r win-x64 --self-contained true -o windows/publish -v quiet
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y | Out-Null
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" /Qp windows/installer/Linework.iss
          if ($LASTEXITCODE -ne 0) { throw "Installer failed" }
      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: windows/installer/Output/Linework-Setup.exe
